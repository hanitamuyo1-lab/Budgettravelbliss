<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Budget Travel Bliss</title>
<link rel="icon" type="image/svg+xml" href="logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ── BINANCE DESIGN TOKENS (DESIGN.md) ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-plex:    'IBM Plex Mono', monospace;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); background: #000; color: #eaecef; font-size: 14px; line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

  /* NAV — top-nav-dark: 64px, canvas-dark bg, yellow wordmark */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,0,0,0.96); backdrop-filter: blur(14px); border-bottom: 1px solid #2b3139; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; }
  .nav-logo { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: #fcd535; letter-spacing: -0.3px; text-decoration: none; }
  .nav-logo span { color: #fcd535; }
  .nav-links { display: flex; gap: 2px; list-style: none; }
  .nav-links a { font-size: 0.875rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: #eaecef; text-decoration: none; transition: color 0.15s, background 0.15s; padding: 6px 10px; border-radius: 6px; }
  .nav-links a:hover { color: #fff; background: #2b3139; }
  /* button-primary: yellow bg, dark text, 6px radius, 40px height */
  .nav-cta { background: #fcd535; color: #181a20; border: none; border-radius: 6px; padding: 0 20px; height: 40px; font-family: var(--font-body); font-size: 0.875rem; font-weight: 600; letter-spacing: 0; text-transform: none; cursor: pointer; transition: background 0.15s; }
  .nav-cta:hover { background: #f0b90b; }

  /* HERO — hero-band-dark: canvas-dark, no gradient, bold sans headline */
  .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 5vw 80px; background: #000; position: relative; }
  .hero::before { content: ''; position: absolute; inset: 0; background: none; pointer-events: none; }
  .hero-label { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #fcd535; margin-bottom: 1.2rem; animation: fadeUp 0.8s ease both; }
  /* hero-display: 700 weight, tight letter-spacing, white */
  .hero h1 { font-family: var(--font-display); font-size: clamp(2.4rem, 8.5vw, 4.5rem); font-weight: 700; line-height: 1.1; letter-spacing: -1px; color: #fff; max-width: 900px; animation: fadeUp 0.8s 0.1s ease both; }
  .hero h1 em { font-style: normal; color: #fcd535; }
  .hero-sub { margin-top: 1.4rem; max-width: 520px; font-size: 1rem; color: #929aa5; font-weight: 400; line-height: 1.65; animation: fadeUp 0.8s 0.2s ease both; }
  .hero-search { margin-top: 2.8rem; position: relative; width: 100%; max-width: 560px; animation: fadeUp 0.8s 0.3s ease both; }
  /* search-input-on-dark: surface-card-dark bg, hairline-dark border, lg radius */
  .hero-search-bar { display: flex; align-items: center; background: #1e2329; border: 1px solid #2b3139; border-radius: 8px; padding: 4px 4px 4px 16px; box-shadow: none; }
  .hero-search input { flex: 1; border: none; outline: none; font-family: var(--font-body); font-size: 0.875rem; color: #fff; background: transparent; min-width: 0; }
  .hero-search input::placeholder { color: #707a8a; }
  /* button-primary-pill on search */
  .hero-search button { background: #fcd535; color: #181a20; border: none; border-radius: 9999px; padding: 0.65rem 1.4rem; font-family: var(--font-body); font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; flex-shrink: 0; }
  .hero-search button:hover { background: #f0b90b; }
  /* search dropdown: surface-card-dark */
  .search-dropdown { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #1e2329; border: 1px solid #2b3139; border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,0.4); overflow-y: auto; max-height: 320px; z-index: 200; }
  .search-dropdown-item { display: flex; align-items: center; gap: 0.9rem; padding: 0.75rem 1.2rem; cursor: pointer; transition: background 0.12s; border: none; width: 100%; background: transparent; text-align: left; font-family: var(--font-body); }
  .search-dropdown-item:hover, .search-dropdown-item.highlighted { background: #2b3139; }
  .search-item-icon { width: 34px; height: 34px; border-radius: 50%; background: #2b3139; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #fcd535; flex-shrink: 0; }
  .search-item-name { font-size: 0.875rem; font-weight: 500; color: #fff; }
  .search-item-meta { font-size: 0.72rem; color: #707a8a; }
  /* number-sm in plex */
  .search-item-price { margin-left: auto; font-family: var(--font-plex); font-size: 0.95rem; font-weight: 500; color: #fcd535; white-space: nowrap; }
  .search-dropdown-empty { padding: 1rem 1.4rem; font-size: 0.875rem; color: #707a8a; }
  .hero-stats { margin-top: 2.2rem; margin-bottom: 0.8rem; display: flex; gap: 3rem; animation: fadeUp 0.8s 0.4s ease both; }
  /* number-display in plex, primary yellow */
  .hero-stat-num { font-family: var(--font-plex); font-size: 2rem; font-weight: 700; color: #fcd535; letter-spacing: -0.3px; }
  .hero-stat-label { font-size: 0.72rem; color: #707a8a; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }

  /* SHARED */
  section { padding: 80px 5vw; }
  .section-label { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #fcd535; margin-bottom: 0.7rem; }
  /* display-md: 600 weight, tight spacing */
  .section-title { font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 2.4rem); font-weight: 700; line-height: 1.15; color: #fff; letter-spacing: -0.3px; }
  .section-title em { font-style: normal; color: #fcd535; }

  /* DESTINATIONS — surface-card-dark section, cards on canvas-dark */
  #destinations { background: #1e2329; }
  .dest-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 2rem; flex-wrap: wrap; }
  .filter-btn { border: 1px solid #2b3139; background: #000; border-radius: 6px; padding: 0.4rem 1rem; font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.15s; color: #707a8a; }
  /* active filter = button-primary */
  .filter-btn.active { background: #fcd535; border-color: #fcd535; color: #181a20; font-weight: 600; }
  .filter-btn:hover:not(.active) { border-color: #fcd535; color: #fcd535; }
  .sort-select { margin-left: auto; border: 1px solid #2b3139; background: #000; border-radius: 6px; padding: 0.4rem 1rem; font-family: var(--font-body); font-size: 0.8rem; color: #707a8a; cursor: pointer; outline: none; }
  .dest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
  /* dest-card = markets-table-card: canvas-dark bg, xl radius, hairline border */
  .dest-card { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #2b3139; transition: transform 0.25s ease, border-color 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
  .dest-card:hover { transform: translateY(-4px); border-color: #fcd535; }
  .dest-img { height: 200px; position: relative; overflow: hidden; background: #2b3139; }
  .dest-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; display: block; }
  .dest-card:hover .dest-img img { transform: scale(1.05); }
  /* badge = yellow primary, sm radius, dark text */
  .dest-badge { position: absolute; top: 12px; left: 12px; background: #fcd535; color: #181a20; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; }
  .dest-body { padding: 1.2rem 1.3rem 1.4rem; }
  .dest-region { font-size: 0.68rem; color: #fcd535; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
  /* title-sm for dest name */
  .dest-name { font-family: var(--font-display); font-size: 1rem; font-weight: 600; margin-top: 0.2rem; color: #fff; }
  .dest-tagline { font-size: 0.8rem; color: #707a8a; margin-top: 0.3rem; line-height: 1.5; }
  .dest-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #2b3139; }
  /* price = number-md in plex, primary yellow */
  .dest-price { font-family: var(--font-plex); font-size: 1.2rem; font-weight: 700; color: #fcd535; letter-spacing: -0.3px; }
  .dest-price span { font-family: var(--font-body); font-size: 0.72rem; color: #707a8a; font-weight: 400; }
  .dest-rating { font-size: 0.72rem; color: #707a8a; }
  /* rating strong = trading-up green */
  .dest-rating strong { color: #0ecb81; }
  .dest-cta { margin-top: 0.8rem; display: inline-block; font-size: 0.75rem; font-weight: 600; color: #fcd535; }

  /* PRICING — canvas-dark section, surface-card-dark cards */
  #pricing { background: #000; }
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; margin-top: 2.5rem; }
  .pricing-card { border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; border: 1px solid #2b3139; background: #1e2329; transition: border-color 0.2s; }
  .pricing-card:hover { border-color: #fcd535; }
  .pricing-card-icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
  .pricing-card-title { font-family: var(--font-display); font-size: 1rem; font-weight: 600; color: #fff; }
  .pricing-row { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 0.3rem 0; border-bottom: 1px solid #2b3139; }
  .pricing-row:last-child { border-bottom: none; }
  .pricing-row-label { color: #707a8a; }
  /* values in plex, yellow */
  .pricing-row-val { font-family: var(--font-plex); font-weight: 500; color: #fcd535; }
  .pricing-total { margin-top: 0.8rem; display: flex; justify-content: space-between; font-size: 0.875rem; font-weight: 600; color: #eaecef; }
  .pricing-total-val { font-family: var(--font-plex); color: #fcd535; font-size: 1.1rem; font-weight: 700; }

  /* BUDGET CALCULATOR — surface-card-dark section */
  #calculator { background: #1e2329; }
  .calc-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; margin-top: 2.5rem; align-items: start; }
  @media(max-width:720px){ .calc-layout { grid-template-columns: 1fr; } }
  .calc-inputs { display: flex; flex-direction: column; gap: 1.4rem; }
  .calc-field label { display: block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #707a8a; margin-bottom: 0.5rem; }
  .calc-field input[type=range] { width: 100%; accent-color: #fcd535; margin-top: 0.3rem; }
  /* text-input style: canvas-dark bg, hairline border, lg radius */
  .calc-field select, .calc-field input[type=number] { width: 100%; border: 1px solid #2b3139; background: #000; border-radius: 8px; padding: 0.6rem 1rem; font-family: var(--font-body); font-size: 0.875rem; color: #eaecef; outline: none; }
  .calc-tiers { display: flex; gap: 0.5rem; }
  .tier-btn { flex: 1; border: 1px solid #2b3139; background: #000; border-radius: 6px; padding: 0.6rem 0.4rem; font-family: var(--font-body); font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all 0.15s; color: #707a8a; text-align: center; }
  .tier-btn.active { background: #fcd535; border-color: #fcd535; color: #181a20; font-weight: 600; }
  /* calc-result panel: canvas-dark, hairline border */
  .calc-result { background: #000; color: #eaecef; border-radius: 12px; padding: 2rem; border: 1px solid #2b3139; }
  .calc-result-dest { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: #fcd535; margin-bottom: 0.4rem; }
  /* number-display: plex, 700, white */
  .calc-result-total { font-family: var(--font-plex); font-size: 3rem; font-weight: 700; line-height: 1; color: #fff; letter-spacing: -0.5px; }
  .calc-result-period { font-size: 0.78rem; color: #707a8a; margin-top: 0.3rem; }
  .calc-breakdown { margin-top: 1.6rem; display: flex; flex-direction: column; gap: 0.7rem; }
  .calc-bar-row { display: flex; flex-direction: column; gap: 0.3rem; }
  .calc-bar-header { display: flex; justify-content: space-between; font-size: 0.78rem; }
  .calc-bar-label { color: #707a8a; }
  .calc-bar-val { color: #eaecef; font-weight: 500; font-family: var(--font-plex); }
  .calc-bar-track { height: 4px; background: #2b3139; border-radius: 2px; overflow: hidden; }
  /* bar fill = primary yellow */
  .calc-bar-fill { height: 100%; border-radius: 2px; background: #fcd535; transition: width 0.5s ease; }
  .calc-afford { margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid #2b3139; font-size: 0.82rem; color: #707a8a; }

  /* CURRENCY CONVERTER — canvas-dark section, surface-card-dark boxes */
  #converter { background: #000; }
  .conv-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; margin-top: 2.5rem; align-items: start; }
  @media(max-width:720px){ .conv-layout { grid-template-columns: 1fr; } }
  .conv-box { background: #1e2329; border: 1px solid #2b3139; border-radius: 12px; padding: 1.5rem; }
  .conv-field { margin-bottom: 1.2rem; }
  .conv-field label { display: block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #707a8a; margin-bottom: 0.4rem; }
  .conv-row { display: flex; gap: 0.6rem; }
  /* number input in plex */
  .conv-row input { flex: 1; border: 1px solid #2b3139; background: #000; border-radius: 8px; padding: 0.7rem 1rem; font-family: var(--font-plex); font-size: 1.3rem; font-weight: 500; color: #fff; outline: none; }
  .conv-row select { border: 1px solid #2b3139; background: #000; border-radius: 8px; padding: 0.7rem 0.8rem; font-family: var(--font-body); font-size: 0.85rem; color: #eaecef; outline: none; min-width: 120px; }
  /* conversion result in plex, primary yellow */
  .conv-result-big { font-family: var(--font-plex); font-size: 2.2rem; font-weight: 700; color: #fcd535; margin: 1rem 0 0.2rem; line-height: 1; letter-spacing: -0.3px; }
  .conv-rate-note { font-size: 0.7rem; color: #707a8a; margin-top: 0.4rem; }
  .conv-quick { display: flex; flex-direction: column; gap: 0.4rem; max-height: 480px; overflow-y: auto; padding-right: 4px; }
  .conv-quick::-webkit-scrollbar { width: 4px; }
  .conv-quick::-webkit-scrollbar-track { background: #1e2329; border-radius: 2px; }
  .conv-quick::-webkit-scrollbar-thumb { background: #2b3139; border-radius: 2px; }
  /* markets-row style for currency rows */
  .conv-quick-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.9rem; background: #1e2329; border-radius: 8px; cursor: pointer; transition: background 0.12s; border: 1px solid transparent; }
  .conv-quick-item:hover { background: #2b3139; }
  .conv-quick-left { display: flex; align-items: center; gap: 0.6rem; }
  .conv-quick-flag { font-size: 1.2rem; }
  .conv-quick-label { font-size: 0.8rem; color: #eaecef; font-weight: 500; }
  .conv-quick-name { font-size: 0.68rem; color: #707a8a; }
  /* number-md in plex */
  .conv-quick-val { font-family: var(--font-plex); font-size: 1rem; font-weight: 500; color: #fff; text-align: right; }
  .conv-quick-currency { font-size: 0.68rem; color: #fcd535; font-weight: 500; letter-spacing: 0.06em; }
  .conv-swap { display: flex; justify-content: center; margin: 0.5rem 0; }
  .conv-swap button { background: #2b3139; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 1rem; cursor: pointer; color: #fcd535; transition: background 0.15s; }
  .conv-swap button:hover { background: #fcd535; color: #181a20; }

  /* TIPS — surface-card-dark section, canvas-dark cards */
  #tips { background: #1e2329; }
  .tips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; margin-top: 2.5rem; }
  .tip-card { background: #000; border-radius: 12px; padding: 1.5rem; border: 1px solid #2b3139; transition: border-color 0.2s; }
  .tip-card:hover { border-color: #fcd535; }
  /* decorative number in elevated-dark (low contrast, like sand was low contrast) */
  .tip-num { font-family: var(--font-plex); font-size: 2.5rem; font-weight: 700; color: #2b3139; line-height: 1; margin-bottom: 0.6rem; }
  .tip-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; margin-bottom: 0.4rem; color: #fff; }
  .tip-text { font-size: 0.8rem; color: #707a8a; line-height: 1.6; }

  /* TESTIMONIALS — canvas-dark (already dark) */
  #testimonials { background: #000; color: #eaecef; }
  #testimonials .section-label { color: #fcd535; }
  #testimonials .section-title { color: #fff; }
  .testi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2.5rem; }
  /* testi-card = surface-card-dark with hairline */
  .testi-card { background: #1e2329; border: 1px solid #2b3139; border-radius: 12px; padding: 1.5rem; }
  .testi-quote { font-family: var(--font-display); font-size: 0.9rem; font-style: italic; font-weight: 400; line-height: 1.65; color: #eaecef; }
  .testi-author { margin-top: 1.2rem; display: flex; align-items: center; gap: 0.8rem; }
  /* avatar = yellow bg, dark text (primary color) */
  .testi-avatar { width: 40px; height: 40px; border-radius: 50%; background: #fcd535; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 0.875rem; color: #181a20; font-weight: 700; flex-shrink: 0; }
  .testi-name { font-size: 0.85rem; font-weight: 600; color: #fff; }
  .testi-location { font-size: 0.72rem; color: #707a8a; }
  /* stars = primary yellow */
  .testi-stars { color: #fcd535; font-size: 0.8rem; margin-top: 0.2rem; }

  /* NEWSLETTER — surface-card-dark, no gradient (Binance: flat color blocks only) */
  #newsletter { background: #1e2329; text-align: center; border-top: 1px solid #2b3139; border-bottom: 1px solid #2b3139; }
  .newsletter-inner { max-width: 520px; margin: 0 auto; }
  .newsletter-sub { font-size: 0.875rem; color: #707a8a; margin-top: 0.7rem; }
  .newsletter-form { display: flex; gap: 0.6rem; margin-top: 2rem; flex-wrap: wrap; }
  .newsletter-form input { flex: 1; min-width: 200px; border: 1px solid #2b3139; background: #000; border-radius: 6px; padding: 0.75rem 1.2rem; font-family: var(--font-body); font-size: 0.875rem; outline: none; color: #eaecef; }
  /* button-primary */
  .newsletter-form button { background: #fcd535; color: #181a20; border: none; border-radius: 6px; padding: 0.75rem 1.6rem; font-family: var(--font-body); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .newsletter-form button:hover { background: #f0b90b; }
  .newsletter-note { font-size: 0.7rem; color: #707a8a; margin-top: 0.8rem; }

  /* FAQ — canvas-dark, faq-row style: hairline dividers, no card border */
  #faq { background: #000; }
  .faq-list { margin-top: 2.5rem; max-width: 720px; display: flex; flex-direction: column; gap: 0; }
  .faq-item { border-top: 1px solid #2b3139; overflow: hidden; }
  .faq-item:last-child { border-bottom: 1px solid #2b3139; }
  /* faq-q: title-sm weight, transparent bg */
  .faq-q { width: 100%; background: transparent; border: none; display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0; cursor: pointer; font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; color: #fff; text-align: left; transition: color 0.15s; }
  .faq-q:hover { color: #fcd535; }
  .faq-icon { width: 22px; height: 22px; border-radius: 50%; background: #2b3139; color: #fcd535; font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.25s; }
  .faq-icon.open { transform: rotate(45deg); }
  .faq-a { background: transparent; padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.35s ease, padding 0.2s; }
  .faq-a.open { max-height: 300px; padding: 0 0 1.2rem; }
  .faq-a p { font-size: 0.85rem; color: #707a8a; line-height: 1.7; }

  /* FOOTER — footer-light: surface-soft-light bg, dark text (Binance signature) */

// Deduplicate by unique name+country
const UNIQUE_DESTINATIONS = DESTINATIONS.filter((d, i, arr) =>
  arr.findIndex(x => x.name === d.name && x.country === d.country) === i
);

// ── SEARCH BOX ────────────────────────────────────────────────
function SearchBox({ onSearch }) {
  const [input, setInput]         = useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [highlighted, setHighlighted] = useState(-1);
  const [open, setOpen]           = useState(false);
  const ref                       = React.useRef(null);

  // Build suggestion list from all unique destinations + countries
  const allSuggestions = React.useMemo(() => {
    const countries = [...new Set(UNIQUE_DESTINATIONS.map(d => d.country))].map(c => ({
      type: "country", label: c,
      sub: UNIQUE_DESTINATIONS.filter(d => d.country === c).map(d => d.name).join(", "),
      query: c,
      minCost: Math.min(...UNIQUE_DESTINATIONS.filter(d=>d.country===c).map(d=>d.dailyCost))
    }));
    const cities = UNIQUE_DESTINATIONS.map(d => ({
      type: "city", label: d.name, sub: d.country + " · " + d.region,
      query: d.name, minCost: d.dailyCost
    }));
    return [...cities, ...countries];
  }, []);

  const handleChange = (val) => {
    setInput(val);
    setHighlighted(-1);
    if (val.trim().length < 1) { setSuggestions([]); setOpen(false); return; }
    const q = val.toLowerCase();
    const matches = allSuggestions.filter(s =>
      s.label.toLowerCase().includes(q) || s.sub.toLowerCase().includes(q)
    ).slice(0, 7);
    setSuggestions(matches);
    setOpen(true);
  };

  const commit = (query) => {
    setInput(query);
    setSuggestions([]);
    setOpen(false);
    onSearch(query);
    // scroll after React updates
    setTimeout(() => {
      const el = document.getElementById("destinations");
      if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: "smooth" });
    }, 60);
  };

  const handleKey = (e) => {
    if (!open || !suggestions.length) {
      if (e.key === "Enter") commit(input);
      return;
    }
    if (e.key === "ArrowDown") { e.preventDefault(); setHighlighted(h => Math.min(h+1, suggestions.length-1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setHighlighted(h => Math.max(h-1, -1)); }
    else if (e.key === "Enter") { e.preventDefault(); highlighted >= 0 ? commit(suggestions[highlighted].query) : commit(input); }
    else if (e.key === "Escape") { setOpen(false); }
  };

  // Close on outside click
  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  return (
    <div className="hero-search" ref={ref}>
      <div className="hero-search-bar">
        <input
          type="text"
          placeholder="Search city, country or region…"
          value={input}
          onChange={e => handleChange(e.target.value)}
          onKeyDown={handleKey}
          onFocus={() => input.length > 0 && setOpen(true)}
          autoComplete="off"
        />
        <button onClick={() => commit(input)}>Search</button>
      </div>
      {open && suggestions.length > 0 && (
        <div className="search-dropdown">
          {suggestions.map((s, i) => (
            <button
              key={s.label + s.type}
              className={`search-dropdown-item${highlighted===i?" highlighted":""}`}
              onMouseDown={() => commit(s.query)}
              onMouseEnter={() => setHighlighted(i)}
            >
              <div className="search-item-icon">{s.type === "country" ? "🌍" : "📍"}</div>
              <div>
                <div className="search-item-name">{s.label}</div>
                <div className="search-item-meta">{s.sub}</div>
              </div>
              <div className="search-item-price">from ${s.minCost}/day</div>
            </button>
          ))}
        </div>
      )}
      {open && input.length > 0 && suggestions.length === 0 && (
        <div className="search-dropdown">
          <div className="search-dropdown-empty">No destinations found for "{input}" — try another keyword.</div>
        </div>
      )}
    </div>
  );
}

function Destinations({ search }) {
  const [filter, setFilter]   = useState("All");
  const [sort, setSort]       = useState("default");
  const [selected, setSelected] = useState(null);
  let items = DESTINATIONS.filter(d => {
    const matchR = filter === "All" || d.region === filter;
    const q = search.toLowerCase();
    const matchS = !q || d.name.toLowerCase().includes(q) || d.country.toLowerCase().includes(q) || d.region.toLowerCase().includes(q);
    return matchR && matchS;
  });
  if (sort === "price-asc")  items = [...items].sort((a,b) => a.dailyCost - b.dailyCost);
  if (sort === "price-desc") items = [...items].sort((a,b) => b.dailyCost - a.dailyCost);
  if (sort === "rating")     items = [...items].sort((a,b) => b.rating - a.rating);
  return (
    <section id="destinations">
      <div className="section-label">Where to go</div>
      <div className="section-title">Top <em>cheap</em> destinations</div>

function BudgetCalculator() {
  const [dest, setDest]   = useState(DESTINATIONS[0].id);
  const [days, setDays]   = useState(14);
  const [tier, setTier]   = useState("midrange");
  const [budgetNum, setBudgetNum] = useState(800);

  const d   = DESTINATIONS.find(x=>x.id===dest);
  const t   = TIER_COSTS[tier];
  const baseDaily = d.dailyCost * t.multiplier;
  const total     = Math.round(baseDaily * days);
  const breakdown = [
    { label:"Accommodation", val: Math.round(t.accom * days * (d.dailyCost/35)), pct:35 },
    { label:"Food & drink",  val: Math.round(t.food  * days * (d.dailyCost/35)), pct:28 },
    { label:"Transport",     val: Math.round(t.transport * days),                 pct:18 },
    { label:"Activities",    val: Math.round(t.fun   * days * (d.dailyCost/35)), pct:19 },
  ];
  const sum = breakdown.reduce((a,b)=>a+b.val,0);
  const canAfford = budgetNum > 0 && budgetNum >= sum;

  return (
    <section id="calculator">
      <div className="section-label">Plan your trip</div>
      <div className="section-title">Budget <em>calculator</em></div>
      <p style={{marginTop:'0.6rem',color:'var(--ink-light)',fontSize:'0.9rem',maxWidth:'520px'}}>Get a realistic estimate for your trip in seconds. Adjust destination, duration and travel style.</p>
      <div className="calc-layout">
        <div className="calc-inputs">
          <div className="calc-field">
            <label>Destination</label>
            <select value={dest} onChange={e=>setDest(+e.target.value)}>
              {DESTINATIONS.map(d=><option key={d.id} value={d.id}>{d.name}, {d.country}</option>)}
            </select>
          </div>
          <div className="calc-field">
            <label>Duration — {days} days</label>
            <input type="range" min={3} max={90} value={days} onChange={e=>setDays(+e.target.value)}/>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.72rem',color:'var(--ink-light)',marginTop:'0.2rem'}}>
              <span>3 days</span><span>90 days</span>
            </div>
          </div>
          <div className="calc-field">
            <label>Travel style</label>
            <div className="calc-tiers">
              {Object.entries(TIER_COSTS).map(([k,v])=>(
                <button key={k} className={`tier-btn${tier===k?" active":""}`} onClick={()=>setTier(k)}>{v.label}</button>
              ))}
            </div>
          </div>
          <div className="calc-field">
            <label>My budget (USD)</label>
            <input type="number" defaultValue="800" min="1" onChange={e=>{ const v=parseInt(e.target.value,10); if(v>0) setBudgetNum(v); }} style={{fontFamily:'var(--font-display)',fontSize:'1.3rem'}}/>
          </div>
        </div>
        <div className="calc-result">
          <div className="calc-result-dest">{d.name}, {d.country}</div>
          <div className="calc-result-total">${sum.toLocaleString()}</div>
          <div className="calc-result-period">estimated for {days} days · {TIER_COSTS[tier].label}</div>
          <div className="calc-breakdown">
            {breakdown.map(b=>(
              <div className="calc-bar-row" key={b.label}>
                <div className="calc-bar-header">
                  <span className="calc-bar-label">{b.label}</span>
                  <span className="calc-bar-val">${b.val.toLocaleString()}</span>
                </div>
                <div className="calc-bar-track">
                  <div className="calc-bar-fill" style={{width:`${Math.round(b.val/sum*100)}%`}}/>
                </div>
              </div>
            ))}
          </div>
          <div className="calc-afford" style={{color: canAfford ? 'oklch(0.75 0.12 155)' : 'var(--coral)'}}>
            {canAfford
              ? `✓ Your $${budgetNum.toLocaleString()} budget covers this trip — with $${(budgetNum-sum).toLocaleString()} to spare.`
              : `⚠ You're $${(sum-budgetNum).toLocaleString()} short. Try reducing days or switching to Backpacker style.`
            }
          </div>
        </div>
      </div>
    </section>
  );
}

function CurrencyConverter() {
  const [amount, setAmount] = useState(100);
  const [from,   setFrom]   = useState("USD");
  const [to,     setTo]     = useState("THB");

  const fromC = CURRENCIES.find(c=>c.code===from);
  const toC   = CURRENCIES.find(c=>c.code===to);
  const usd   = (amount || 0) / fromC.rate;
  const result = (usd * toC.rate);
  const fmt = (v, code) => {
    const c = CURRENCIES.find(x=>x.code===code);
    if (v >= 1000) return c.symbol + Math.round(v).toLocaleString();
    return c.symbol + v.toFixed(2);
  };

  const swap = () => { setFrom(to); setTo(from); };

  // Quick reference: $50 in various currencies
  const quickAmounts = [50, 100, 500];

  return (
    <section id="converter">
      <div className="section-label">Spend smart</div>
      <div className="section-title">Currency <em>converter</em></div>
      <p style={{marginTop:'0.6rem',color:'var(--ink-light)',fontSize:'0.9rem',maxWidth:'520px'}}>Indicative rates to help you budget. Always check your bank's rate before travel.</p>
      <div className="conv-layout">
        <div className="conv-box">
          <div className="conv-field">
            <label>You have</label>
            <div className="conv-row">
              <input type="number" defaultValue="100" onChange={e=>{ const v=parseFloat(e.target.value); setAmount(isNaN(v)?0:v); }}/>
              <select value={from} onChange={e=>setFrom(e.target.value)}>
                {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.flag} {c.code} — {c.name}</option>)}
              </select>
            </div>
          </div>
          <div className="conv-swap"><button onClick={swap} title="Swap currencies">⇅</button></div>
          <div className="conv-field">
            <label>You get</label>
            <div className="conv-row">
              <input type="number" readOnly value={result >= 1000 ? Math.round(result) : +result.toFixed(2)} style={{background:'var(--teal-light)',color:'var(--teal)',fontWeight:500}}/>
              <select value={to} onChange={e=>setTo(e.target.value)}>
                {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.flag} {c.code} — {c.name}</option>)}
              </select>
            </div>
          </div>
          <div className="conv-result-big">{fmt(result, to)}</div>
          <div className="conv-rate-note">1 {from} ≈ {fmt(toC.rate / fromC.rate, to)} · Indicative rates only</div>
        </div>
        <div>
          <p style={{fontSize:'0.78rem',fontWeight:500,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--ink-light)',marginBottom:'0.8rem'}}>$1 USD across all currencies</p>
          <div className="conv-quick">
            {CURRENCIES.filter(c=>c.code!=="USD").map(c=>(
              <div className="conv-quick-item" key={c.code} onClick={()=>{setFrom("USD");setTo(c.code);}}>
                <div className="conv-quick-left">
                  <span className="conv-quick-flag">{c.flag}</span>
                  <div>
                    <div className="conv-quick-label">{c.name}</div>
                    <div className="conv-quick-name">{c.code}</div>
                  </div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div className="conv-quick-val">{c.symbol}{c.rate >= 1000 ? Math.round(c.rate).toLocaleString() : c.rate >= 10 ? c.rate.toFixed(1) : c.rate.toFixed(2)}</div>
                  <div className="conv-quick-currency">per $1</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

          <div className="gallery-item-label">{item.dest}</div>
          <div className="gallery-item-sub">{item.tag}</div>
        </div>
      </div>
    </div>
  );
}

function PhotoGallery() {
  const [lightboxIdx, setLightboxIdx] = useState(null);
  const [lbLoaded, setLbLoaded] = useState(false);

  const open  = (i) => { setLightboxIdx(i); setLbLoaded(false); };
  const close = ()  => setLightboxIdx(null);
  const prev  = (e) => { e.stopPropagation(); setLbLoaded(false); setLightboxIdx(i => (i - 1 + GALLERY_PHOTOS.length) % GALLERY_PHOTOS.length); };
  const next  = (e) => { e.stopPropagation(); setLbLoaded(false); setLightboxIdx(i => (i + 1) % GALLERY_PHOTOS.length); };

  useEffect(() => {
    const handler = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowLeft") setLightboxIdx(i => i !== null ? (i-1+GALLERY_PHOTOS.length)%GALLERY_PHOTOS.length : i); if (e.key === "ArrowRight") setLightboxIdx(i => i !== null ? (i+1)%GALLERY_PHOTOS.length : i); };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  const lbItem = lightboxIdx !== null ? GALLERY_PHOTOS[lightboxIdx] : null;

  return (
    <>
      <section id="gallery">
        <div className="section-label">Inspire your wanderlust</div>
        <div className="section-title">Real places, <em>real photos</em></div>
        <p className="gallery-subtitle">Click any photo to explore — every image links to a real destination you can visit on a budget.</p>
        <div className="gallery-grid">
          {GALLERY_PHOTOS.map((item, i) => (
            <GalleryItem key={item.photo} item={item} index={i} onClick={open} />
          ))}
        </div>
        <div className="gallery-cta">
          <button className="gallery-cta-btn" onClick={() => document.getElementById("destinations").scrollIntoView({behavior:"smooth"})}>
            Browse all 108 destinations →
          </button>
        </div>
      </section>

      <div className={`lightbox${lightboxIdx !== null ? " open" : ""}`} onClick={close}>
        {lbItem && (
          <div className="lightbox-img-wrap" onClick={e => e.stopPropagation()}>
            <button className="lightbox-close" onClick={close}>×</button>
            <button className="lightbox-nav lightbox-prev" onClick={prev}>‹</button>
            <img
              src={`https://images.unsplash.com/photo-${lbItem.photo}?auto=format&fit=crop&w=1400&q=85`}
              alt={lbItem.dest}
              className={lbLoaded ? "loaded" : ""}
              onLoad={() => setLbLoaded(true)}
              style={{ opacity: lbLoaded ? 1 : 0, transition: "opacity 0.4s" }}
            />
            <button className="lightbox-nav lightbox-next" onClick={next}>›</button>
            <div className="lightbox-caption">{lbItem.dest} · {lbItem.tag}</div>
          </div>
        )}
      </div>
    </>
  );
}

function App() {
  const [search,        setSearch]        = useState("");
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    window.addEventListener("message", e => {
      if (e.data?.type === "__activate_edit_mode")   setTweaksVisible(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksVisible(false);
    });
    window.parent.postMessage({type:"__edit_mode_available"}, "*");
  }, []);

  const handleSearch = useCallback((q) => {
    setSearch(q);
  }, []);

  // Hero background photos (rotating)
  const HERO_PHOTOS = [
    { id:"1506905925346-21bda4d32df4", alt:"Mountain landscape at golden hour" },
    { id:"1476514525535-07fb3b4ae5f1", alt:"Tropical beach with turquoise water" },
    { id:"1519922639192-e73293ca430e", alt:"Chiang Mai temple at sunset" },
    { id:"1555881400-74d7acaacd8b", alt:"Lisbon colorful streets" },
  ];

  return (
    <>
      <section className="hero">
        <HeroBg photos={HERO_PHOTOS} />
        <div className="hero-label">Budget Travel Bliss · Est. 2024</div>
        <h1>The world on a <em>budget</em><br/>never looked this good</h1>
        <p className="hero-sub">Handpicked destinations where your money goes further — without sacrificing a single experience.</p>
        <div className="hero-stats">
          <div><div className="hero-stat-num">108</div><div className="hero-stat-label">Featured cities</div></div>
          <div><div className="hero-stat-num">$28</div><div className="hero-stat-label">Avg. daily cost</div></div>
          <div><div className="hero-stat-num">48k</div><div className="hero-stat-label">Happy travellers</div></div>
        </div>
        <SearchBox onSearch={handleSearch} />
      </section>

      <Destinations search={search}/>
      <Pricing/>
      <BudgetCalculator/>
      <CurrencyConverter/>
      <Tips/>
      <PhotoGallery/>
      <Testimonials/>
      <Newsletter/>
      <FAQ/>

      <footer>
        <div className="footer-logo">Budget <span>Travel</span> Bliss</div>
        <ul className="footer-links">
          <li><a href="about.html">About</a></li><li><a href="contact.html">Contact Us</a></li><li><a href="privacy.html">Privacy Policy</a></li><li><a href="terms.html">Terms of Service</a></li>
        </ul>
        <div className="footer-copy">© 2024 Budget Travel Bliss. All rights reserved.</div>
      </footer>
      <TweaksPanel visible={tweaksVisible}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
